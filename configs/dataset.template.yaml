# Template configuration for the Multi-Objective Framework (MOF) ECG use case.
# Copy to configs/my_study.yaml and edit paths/codes for your cohort.
#
# Two data modes:
#   build    — run src/build_datasets.py (manifest + preprocessed .npy)
#   prebuilt — skip build; point data.prebuilt_root at external pickles
#
# Usage (build mode):
#   export MOF_CONFIG=configs/my_study.yaml
#   python src/build_datasets.py --config configs/my_study.yaml
#
# Usage (prebuilt mode):
#   python src/train_multi_f_array.py --config configs/my_study.yaml --task-id 0

name: my_dataset

output_root: /path/to/run_directory

data:
  mode: build          # build | prebuilt
  prebuilt_root: null  # required when mode=prebuilt

ecg:
  n_leads: 12
  signal_len: 5000
  source_len: 10000
  length_policy: center_crop

input:
  artifacts_dir: /path/to/preprocessed_ecgs
  manifest_filename: manifest.csv
  npy_suffix: "_processed.npy"
  demographics_path: /path/to/demographics.xlsx
  manifest_columns:
    ecg_id_column: ecg_id
    diagnosis_column: diagnosis
  demographics_columns:
    ecg_id_column: "ECG ID"
    sex_column: sex
    diagnosis_column: "main psychiatric diagnosis"
    age_column: null

normal_pool:
  cases_only: false
  negative_diagnosis: null
  pkl: null
  external_data_root: /path/to/external_run
  external_shared_subdir: shared
  external_pkl_name: recs_normal.pkl

diagnoses:
  codes:
    - F20.0
    - F32.10
  auto_discover: false
  min_count: 5

demographic_matching:
  age_tolerance: 5
  match_gender: true
  match_age: true

training:
  learning_rates: [1.0e-5, 5.0e-5, 1.0e-4, 5.0e-4, 1.0e-3]
  dropout_rates: [0.0, 0.05, 0.1, 0.2, 0.3, 0.5]
  architectures: [st_cnn, resnet1d]
  batch_size: 32
  epochs: 50
  random_state: 42
  threshold: 0.5

xai:
  n_samples: 200
  shap_bg: 50
  default_best:
    arch: st_cnn
    lr: "1e-4"
    dr: "0.1"
  best_configs: {}

objectives:
  f_P:
    metrics: [test_acc_mean, test_precision_mean, test_recall_mean, test_specificity_mean]
    normalize: per_task_minmax
  f_S:
    method: inv_std
  f_E:
    components: [continuity_valid, compactness_valid, contrastivity_valid]

# MOF analysis (frontier dataset assembly)
analysis:
  task_column: psych_code   # use task_id for non-psychiatry cohorts
  recall_min: 0.30          # set null to disable recall filter
  recall_metric: test_recall_mean
